---
all:
  vars:
    ansible_user: deploy
    ansible_become: true
    kube_version: v1.36.2
    pod_subnet: 10.244.0.0/16
    service_subnet: 10.96.0.0/12
    control_plane_endpoint: k8s-api.internal:6443
    control_plane_endpoint_is_load_balancer: false

    # The libvirt default bridge exposes the host to guests as 192.168.122.1.
    apt_repo_url: http://192.168.122.1:8081/debian
    apt_repo_trusted: true
    harbor_registry: harbor.internal:8080
    harbor_plain_http: true
    harbor_skip_tls_verify: false
    airgap_host_entries:
      - address: 192.168.122.1
        names: [harbor.internal]
      - address: 192.168.122.11
        names: [k8s-api.internal]

    local_path: /var/local-path-provisioner
    metallb_ip_address_pool: 192.168.122.240-192.168.122.250
    metallb_version: 0.16.1
    traefik_chart_version: 40.3.0
    cilium_chart_version: 1.20.2
    cilium_operator_replicas: 1
    metrics_server_chart_version: 3.14.0
    cert_manager_chart_version: v1.21.2
    # Run the documented Vault bootstrap before install-platform.yml.
    cert_manager_vault_enabled: true
    cert_manager_vault_server: http://192.168.122.1:8200
    cert_manager_vault_allow_insecure_http: true
    argocd_chart_version: 10.9.6
    argocd_hostname: argocd.internal
    nfs_csi_chart_version: 4.13.4
    # The driver is installed, but no NFS StorageClass is created by default.
    nfs_csi_create_storage_class: false
    nfs_csi_server: ''
    nfs_csi_share: ''
  children:
    control_plane:
      hosts:
        cp-01:
          ansible_host: 192.168.122.11
    workers:
      hosts:
        worker-01:
          ansible_host: 192.168.122.21
        worker-02:
          ansible_host: 192.168.122.22
