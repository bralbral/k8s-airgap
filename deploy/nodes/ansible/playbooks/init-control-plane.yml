---
- name: Initialise the first control-plane node
  hosts: control_plane[0]
  become: true
  tasks:
    - name: Validate control-plane topology
      ansible.builtin.assert:
        that:
          - groups['control_plane'] | length > 0
          - >-
            (groups['control_plane'] | length == 1) or
            (control_plane_endpoint_is_load_balancer | bool)
        fail_msg: >-
          Multiple control-plane nodes require
          control_plane_endpoint_is_load_balancer=true and a working TCP load
          balancer or VIP at control_plane_endpoint.

    - name: Warn when stacked etcd has an even member count
      ansible.builtin.debug:
        msg: >-
          An odd number of control-plane nodes is recommended for etcd quorum;
          use three nodes instead of two when fault tolerance is required.
      when:
        - groups['control_plane'] | length > 1
        - groups['control_plane'] | length % 2 == 0

    - name: Render kubeadm configuration
      ansible.builtin.template:
        src: ../templates/kubeadm-init.yaml.j2
        dest: /root/kubeadm-init.yaml
        mode: '0600'

    - name: Initialise first control-plane node
      ansible.builtin.command: kubeadm init --config /root/kubeadm-init.yaml
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Install Cilium CNI
      ansible.builtin.command: >-
        {{ bundle_root }}/tools/helm upgrade --install cilium
        {{ bundle_root }}/repositories/registry/charts/archives/cilium-{{ cilium_chart_version }}.tgz
        --kubeconfig /etc/kubernetes/admin.conf
        --namespace kube-system --wait --timeout 10m
        --values {{ bundle_root }}/repositories/registry/charts/values/cilium.yaml
        --set operator.replicas=1
      changed_when: true

    - name: Render offline local-path provisioner manifest
      ansible.builtin.template:
        src: ../templates/local-path-provisioner.yaml.j2
        dest: /root/local-path-provisioner.yaml
        mode: '0600'

    - name: Install local-path provisioner
      ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f /root/local-path-provisioner.yaml
      changed_when: true

    - name: Create worker join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: true
      no_log: true

    - name: Store worker join command
      ansible.builtin.set_fact:
        worker_join_command: "{{ join_command.stdout }}"
      no_log: true
