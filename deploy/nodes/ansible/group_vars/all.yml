---
bundle_root: /opt/k8s-airgap
containerd_config: /etc/containerd/config.toml
airgap_host_entries: []
# With more than one host in the control_plane inventory group, this must be
# true and control_plane_endpoint must resolve to an external TCP load balancer
# or VIP in front of every control-plane node.
control_plane_endpoint_is_load_balancer: false
node_packages:
  - ca-certificates
  - chrony
  - conntrack
  - curl
  - ethtool
  - iproute2
  - ipset
  - iptables
  - nfs-common
  - nftables
  - python3
  - rsync
  - socat
  - util-linux
containerd_registry_mirrors:
  - upstream: docker.io
    project: docker
  - upstream: ghcr.io
    project: ghcr
  - upstream: quay.io
    project: quay
  - upstream: registry.k8s.io
    project: k8s
# Reserve this range outside DHCP and all other hosts before running the
# control-plane playbook. It must be reachable on the same L2 network as nodes.
metallb_ip_address_pool: 10.10.0.240-10.10.0.250
metallb_version: 0.16.1
traefik_chart_version: 40.3.0
cilium_chart_version: 1.20.2
cilium_operator_replicas: 1
metrics_server_chart_version: 3.14.0
cert_manager_chart_version: v1.21.2
# An external Vault can be used as the cluster-wide cert-manager PKI issuer.
# The Vault server itself is never installed inside Kubernetes by this repo.
cert_manager_vault_enabled: true
cert_manager_vault_server: http://vault.internal:8200
# Vault is intentionally served over HTTP in this isolated-network profile.
cert_manager_vault_allow_insecure_http: true
cert_manager_vault_pki_path: pki_int/sign/kubernetes
cert_manager_vault_auth_mount: /v1/auth/kubernetes-airgap
cert_manager_vault_role: cert-manager
cert_manager_vault_cluster_issuer: vault-pki
cert_manager_vault_service_account: vault-issuer
cert_manager_vault_kubernetes_api_audience: https://kubernetes.default.svc.cluster.local
# PEM-encoded CA for a private HTTPS Vault listener. Leave empty for HTTP or
# when Vault's server certificate is already trusted by cert-manager.
cert_manager_vault_ca_bundle: ''
argocd_chart_version: 10.9.6
argocd_hostname: argocd.internal
argocd_create_http_route: true
nfs_csi_enabled: true
nfs_csi_chart_version: 4.13.4
# Installing the driver does not require an NFS server. A StorageClass is
# created only when the following switch and endpoint values are configured.
nfs_csi_create_storage_class: false
nfs_csi_server: ''
nfs_csi_share: ''
nfs_csi_storage_class: nfs-csi
nfs_csi_reclaim_policy: Retain
nfs_csi_mount_options:
  - nfsvers=4.1
