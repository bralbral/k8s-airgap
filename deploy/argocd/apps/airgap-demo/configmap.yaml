---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airgap-demo-page
data:
  index.html: |
    <!doctype html>
    <html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Airgap Demo — GitOps</title><style>
    *{box-sizing:border-box}body{margin:0;background:#0b1423;color:#ecf2fb;font:18px/1.6 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:80px 28px}.eyebrow{color:#52dac0;letter-spacing:.18em;font-size:13px;text-transform:uppercase}h1{font-size:clamp(38px,6vw,70px);line-height:1.1;max-width:850px;margin:24px 0}p{color:#aebcd1;max-width:740px}.badge{display:inline-block;padding:7px 16px;border:1px solid #52dac0;color:#52dac0;border-radius:30px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:48px 0}.card{padding:24px;border:1px solid #29394e;border-radius:14px;background:#111f32}.card span{font-size:12px;color:#8aa2bf;text-transform:uppercase;letter-spacing:.12em}.card strong{display:block;font-size:24px;margin-top:12px}.flow{border-top:1px solid #29394e;padding-top:28px;color:#52dac0}footer{font-size:13px;color:#8aa2bf;margin-top:56px}
    </style></head><body><main><div class="eyebrow">Kubernetes / isolated environment</div>
    <h1>Приложение доставлено через GitOps</h1>
    <p>Эта страница — демонстрационное приложение. Манифесты поступают из Git-репозитория, контейнерный образ — из Harbor. Развёртыванием управляет Argo CD.</p>
    <div class="badge">Версия демонстрации: v2</div>
    <div class="grid"><div class="card"><span>Delivery</span><strong>Argo CD</strong></div><div class="card"><span>Runtime</span><strong>BusyBox HTTP</strong></div><div class="card"><span>Exposure</span><strong>MetalLB</strong></div><div class="card"><span>Namespace</span><strong>demo</strong></div></div>
    </main></body></html>
