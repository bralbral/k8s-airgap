---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airgap-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airgap-demo
  template:
    metadata:
      labels:
        app: airgap-demo
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/library/busybox:1.37.0
          command: [httpd, -f, -p, "8080", -h, /www]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
          volumeMounts:
            - name: page
              mountPath: /www
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: airgap-demo-page
