global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend kubernetes_api
    bind :6443
    default_backend control_planes

backend control_planes
    balance roundrobin
    option tcp-check
    server cp-01 10.10.0.11:6443 check
    server cp-02 10.10.0.12:6443 check
    server cp-03 10.10.0.13:6443 check
