---
name: airgap-apt
services:
  apt:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8081:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
