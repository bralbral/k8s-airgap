server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=60s;
    set $debian_host cdn-fastly.deb.debian.org;

    # Stream only requested files. No mirror, cache or temporary package files.
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_set_header Host $debian_host;

    location ~ ^/(debian|debian-security)/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://$debian_host$request_uri;
    }
    location / { return 404; }
}
