---
- name: Configure local storage on the worker system disks
  hosts: control_plane[0]
  become: true
  tasks:
    - name: Label worker nodes
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf label node {{ item }}
        node-role.kubernetes.io/worker= --overwrite
      loop: "{{ groups['workers'] }}"
      changed_when: true
    - name: Read the bundled upstream local-path manifest
      ansible.builtin.slurp:
        src: "{{ bundle_root }}/deploy/platform/manifests/local-path-provisioner.yaml"
      register: local_path_manifest
    - name: Use the requested directory on worker system disks
      ansible.builtin.copy:
        content: "{{ local_path_manifest.content | b64decode | replace('/opt/local-path-provisioner', local_path) }}"
        dest: /root/local-path-provisioner.yaml
        mode: '0600'
    - name: Install local-path provisioner
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f /root/local-path-provisioner.yaml
      changed_when: true
    - name: Mark local-path as the default StorageClass
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf annotate storageclass local-path
        storageclass.kubernetes.io/is-default-class=true --overwrite
      changed_when: true
    - name: Wait for the provisioner
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf -n local-path-storage
        rollout status deployment/local-path-provisioner --timeout=5m
      changed_when: false
