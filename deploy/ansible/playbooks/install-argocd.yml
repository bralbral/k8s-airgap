---
- name: Install Argo CD as the final bootstrap component
  hosts: control_plane[0]
  become: true
  tasks:
    - name: Install Argo CD from Harbor
      ansible.builtin.command: >-
        {{ bundle_root }}/tools/helm upgrade --install argocd
        oci://{{ harbor_registry }}/charts/argo-cd
        --version {{ argocd_chart_version }}
        {{ '--plain-http' if harbor_plain_http else '' }}
        {{ '--insecure-skip-tls-verify' if harbor_skip_tls_verify else '' }}
        --kubeconfig /etc/kubernetes/admin.conf
        --namespace argocd --create-namespace --wait --timeout 10m
        --values {{ bundle_root }}/repositories/registry/charts/values/argo-cd.yaml
      changed_when: true
    - name: Render a LoadBalancer Service without NodePorts
      ansible.builtin.template:
        src: ../templates/argocd-service.yaml.j2
        dest: /root/argocd-service.yaml
        mode: '0600'
    - name: Expose Argo CD on its reserved MetalLB address
      ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f /root/argocd-service.yaml
      changed_when: true
    - name: Wait for MetalLB to assign the requested IP
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf -n argocd get service argocd-public
        -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: argocd_address
      changed_when: false
      until: argocd_address.stdout == argocd_ip
      retries: 30
      delay: 5
