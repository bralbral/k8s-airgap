---
- name: Finalise Cilium after every cluster node has joined
  hosts: control_plane[0]
  become: true
  tasks:
    - name: Configure the requested number of Cilium operator replicas
      ansible.builtin.command: >-
        {{ bundle_root }}/tools/helm upgrade --install cilium
        oci://{{ harbor_registry }}/charts/cilium
        --version {{ cilium_chart_version }}
        {{ '--plain-http' if harbor_plain_http else '' }}
        {{ '--insecure-skip-tls-verify' if harbor_skip_tls_verify else '' }}
        --kubeconfig /etc/kubernetes/admin.conf
        --namespace kube-system --wait --timeout 10m
        --values {{ bundle_root }}/repositories/registry/charts/values/cilium.yaml
        --set operator.replicas={{ cilium_operator_replicas }}
      changed_when: true

    - name: Wait until all five nodes are Ready
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf wait nodes --all
        --for=condition=Ready --timeout=10m
      changed_when: false
