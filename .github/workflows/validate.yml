---
name: Validate

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate shell syntax
        run: |
          bash -n .github/scripts/*.sh
          bash -n deploy/scripts/*.sh
          bash -n deploy/infrastructure/scripts/*.sh
      - name: Validate YAML
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint
          yamllint -d '{extends: default, rules: {line-length: disable}}' config deploy .github
