---
name: Validate

"on":
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible-core shellcheck yamllint zstd
      - name: Validate repository
        run: .github/scripts/validate.sh
