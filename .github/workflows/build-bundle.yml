---
name: Build offline bundle

"on":
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version, for example 2026.10.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-offline-bundle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install crane
        run: |
          source config/versions.env
          curl --fail --location --retry 4 -o crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          tar -xzf crane.tar.gz crane
          sudo install -m 0755 crane /usr/local/bin/crane
      - name: Build bundle
        run: .github/scripts/build-bundle.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          .github/scripts/publish-release.sh
          '${{ inputs.release_version }}'
          '${{ github.sha }}'
