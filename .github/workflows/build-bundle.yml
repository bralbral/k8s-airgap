---
name: Build offline bundle

"on":
  workflow_dispatch:

run-name: "Build air-gap release #${{ github.run_number }}.${{ github.run_attempt }}"

permissions:
  contents: write

concurrency:
  group: build-offline-bundle
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint
      - name: Validate repository
        run: .github/scripts/validate.sh

  build:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            unzip \
            zstd
      - name: Install crane
        run: |
          source config/versions.env
          curl --fail --location --retry 4 -o crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          tar -xzf crane.tar.gz crane
          sudo install -m 0755 crane /usr/local/bin/crane
      - name: Build bundle
        run: bash -x .github/scripts/build-bundle.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh '${{ github.sha }}'
